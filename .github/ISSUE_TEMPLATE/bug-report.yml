name: Bug report
description: Report a reproducible non-security defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, private prompts, private images, or security vulnerabilities. Use private vulnerability reporting for security issues.
  - type: input
    id: dsh
    attributes:
      label: DSH version
      placeholder: 0.1.0-rc.6
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin version or commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Node.js version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted logs
    validations:
      required: true
