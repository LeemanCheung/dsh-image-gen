name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed bundles are current
        run: git diff --exit-code -- lib/index.js lib/client.js lib/client.js.map
      - run: npm pack --dry-run --ignore-scripts
      - run: npm audit --omit=dev
